name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version from `packageManager` in package.json, Node.js from .nvmrc,
      # then `pnpm install --frozen-lockfile`
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
